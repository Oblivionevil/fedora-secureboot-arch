# Konfiguration für fedora-sb-sync (Fedora shim + GRUB auf Arch Linux).
# Nach Änderungen:  sudo fedora-sb-sync
#
# Alle übrigen GRUB-Einstellungen (Standardeintrag, Timeout, Auflösung, Theme,
# Kernel-Parameter, os-prober …) kommen wie gewohnt aus /etc/default/grub,
# eigene Einträge aus /etc/grub.d/40_custom. Hier steht nur, was davon abweicht.

# Eingehängte EFI-Systempartition
ESP=/boot/efi

# Name des UEFI-Booteintrags
ENTRY_LABEL="Fedora Secure Boot (Arch)"

# Kernel-Kommandozeile. Leer = wie grub-mkconfig:
#   root=UUID=<UUID von /> rw  +  GRUB_CMDLINE_LINUX(_DEFAULT) aus /etc/default/grub
CMDLINE=""

# Zusätzliche Parameter nur für den Fedora-Kernel
EXTRA_CMDLINE=""

# Parameter für die Anforderungen von EAC Linux v2. "auto" ergibt:
#   lockdown=integrity sysctl.kernel.kexec_load_disabled=1 iommu.passthrough=0
#   (+ intel_iommu=on auf Intel-CPUs)
# Leer lassen, um sie abzuschalten.
EAC_CMDLINE=auto

# Timeout des Menüs in Sekunden. Leer = GRUB_TIMEOUT aus /etc/default/grub
TIMEOUT=""

# Windows-Boot-Manager ins Menü aufnehmen: yes, no oder auto (= wenn auf der ESP
# vorhanden und GRUB_DISABLE_OS_PROBER=false in /etc/default/grub)
WINDOWS_ENTRY=auto
